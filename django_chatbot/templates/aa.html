<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Création de compte</title>
<style>
  body{
    
    background: linear-gradient(to right, #2575fc, #6a11cb);
    font-family: 'Open Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: white; 
  }

  #container{
    text-align: center;
  }

  #html-spinner{
    width:40px;
    height:40px;
    border:4px solid rgba(255,255,255,0.3);
    border-top:4px solid white;
    border-radius:50%;
    margin: 0 auto;
    animation: rotate 1.2s linear infinite;
  }

  @keyframes rotate {
    from {transform: rotate(0deg);}
    to {transform: rotate(360deg);}
  }

  #html-para{
    margin-top: 20px;
    font-size: 16px;
    font-weight: bold;
    color: white; 
  }
</style>
</head>
<body>
  <div id="container">
    <div id="html-spinner"></div>
    <p id="html-para">En cours de création du compte...</p>
  </div>

<script>
 
  setTimeout(() => {
    document.getElementById('html-para').textContent = "Compte créé avec succès !";
    document.getElementById('html-spinner').style.display = "none";

    
    setTimeout(() => {
     window.location.href = "{% url 'chatbot_page' %}"; 
    }, 1000); 
  }, 5000); 
</script>
</body>
</html>
